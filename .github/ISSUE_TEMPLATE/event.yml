name: Add Event
description: Ajouter un nouvel événement communautaire
title: '[Event]: '
labels:
- event
body:
- type: input
  id: title
  attributes:
    label: Event Title
    description: Le nom de l'événement
    placeholder: 'ex: Meetup AWS re:Invent re:Cap'
  validations:
    required: true
- type: input
  id: date
  attributes:
    label: Event Date
    description: Quand l'événement aura-t-il lieu ? (AAAA-MM-JJ HH:mm)
    placeholder: 2025-02-20 18:30
  validations:
    required: true
- type: input
  id: url
  attributes:
    label: Event URL
    description: Lien vers la page de l'événement
    placeholder: https://www.meetup.com/...
  validations:
    required: true
- type: dropdown
  id: community
  attributes:
    label: Community
    description: Sélectionnez la communauté organisatrice
    options:
    - afup-bordeaux
    - agile-bordeaux
    - agile-tour-bordeaux
    - apero-web
    - aquilenet
    - aquinum
    - archilocus
    - aws-bordeaux
    - bdx-io
    - bdx-testing-community
    - bieresecu
    - bordeaux-aperops
    - bordeaux-machine-learning
    - bordeaux-python-meetup
    - bordeaux-xr
    - bordeauxjs
    - bordeauxjug
    - bordeauxkt
    - cafe-ia
    - cloud-native-bordeaux
    - cocoaheads
    - creative-coding-bordeaux
    - data-for-good
    - dev-with-ai
    - digitalnights
    - framer-bordeaux
    - france-design-week-bordeaux
    - friends-of-figma-bordeaux
    - gdg-bordeaux
    - grappe-numerique
    - human-talks
    - la-boussole-de-la-tech
    - le-nom-lieu
    - mtg-bordeaux
    - okiwi
    - openstreetmap-bordeaux
    - serious-gamers-bordeaux
    - wip-bordeaux
    - women-in-tech-bordeaux
  validations:
    required: true
- type: input
  id: location
  attributes:
    label: Location
    description: Où se déroulera l'évènement ?
    placeholder: Le node, 12 Rue des Faussets, 33000 Bordeaux
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
    description: Description de l'évènement (supports markdown)
    placeholder: Cet évènement exceptionnel ...
  validations:
    required: false
- type: dropdown
  id: is_online
  attributes:
    label: S'agit-il d'un événement en ligne ?
    options:
    - 'No'
    - 'Yes'
  validations:
    required: true
